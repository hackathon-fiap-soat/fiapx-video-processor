# Análise no SonarCloud (Etapa 8, spec §11.2): o CI roda o scanner depois dos testes e espera o Quality Gate.
sonar.organization=hackathon-fiap-soat
sonar.projectKey=hackathon-fiap-soat_fiapx-video-processor
sonar.projectName=fiapx-video-processor
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=app
sonar.tests=tests
sonar.php.coverage.reportPaths=coverage/clover.xml
# Com o novo escopo de análise do SonarCloud, sonar.sources e sonar.tests não têm efeito e o projeto inteiro é
# analisado. A cobertura do PHPUnit é medida só em app/ (phpunit.xml): o resto fica fora do cálculo de cobertura.
sonar.coverage.exclusions=tests/**,bootstrap/**,config/**,database/**,routes/**,public/**,resources/**,storage/**,artisan
