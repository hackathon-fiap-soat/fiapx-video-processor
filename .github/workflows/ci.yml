name: ci

# Checks de todo PR (spec §11.2): pint, phpstan, phpunit (cobertura ≥ 80%, com ffmpeg real e o LocalStack do
# fiapx-infra/local), build da imagem + Trivy e kustomize + kubeconform. O deploy na AWS fica fora deste
# workflow (ADR-018). O SonarCloud entra na Etapa 8.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: fiapx-video-processor
    steps:
      # Repositórios lado a lado, como na máquina de quem desenvolve (o compose monta ../fiapx-docs).
      - uses: actions/checkout@v4
        with: { path: fiapx-video-processor }
      - uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-docs, path: fiapx-docs }
      - uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-infra, path: fiapx-infra }
      - name: Ambiente local (MySQL + LocalStack + Mailpit)
        working-directory: fiapx-infra/local
        run: docker compose up -d --wait
      - name: Imagem de desenvolvimento (com ffmpeg) e dependências
        run: |
          cp .env.example .env
          docker compose build -q processor
          docker compose run --rm -q processor composer install --no-interaction --no-progress
      - name: Pint e PHPStan
        run: docker compose run --rm -q processor composer lint
      - name: PHPUnit (unit, contrato e integração) com cobertura ≥ 80%
        run: docker compose run --rm -q processor composer test:coverage
      - name: Logs do ambiente em caso de falha
        if: failure()
        working-directory: fiapx-infra/local
        run: docker compose logs --no-color

  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem de produção (linux/amd64)
        run: docker build --platform linux/amd64 -t fiapx-video-processor:${{ github.sha }} .
      - name: Trivy (falha em CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fiapx-video-processor:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build + kubeconform
        run: |
          cp k8s/overlays/prod/aws.env.example k8s/overlays/prod/aws.env
          docker run --rm -v "$PWD/k8s":/k8s registry.k8s.io/kustomize/kustomize:v5.6.0 build /k8s/overlays/prod > manifests.yaml
          docker run --rm -v "$PWD":/w ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 /w/manifests.yaml
