name: CI · testes, imagem e manifests do video-processor

# Checks de todo PR (spec §11.2): pint, phpstan, phpunit (cobertura ≥ 80%, com ffmpeg real e o LocalStack do
# fiapx-infra/local), build da imagem + Trivy e kustomize + kubeconform. O deploy na AWS fica fora deste
# workflow (ADR-018). O SonarCloud entra na Etapa 8.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Lint e testes (Pint, PHPStan e PHPUnit com ffmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: fiapx-video-processor
    steps:
      # Repositórios lado a lado, como na máquina de quem desenvolve (o compose monta ../fiapx-docs).
      - name: Baixar o fiapx-video-processor
        uses: actions/checkout@v4
        # Histórico completo: o SonarCloud usa o blame para separar código novo do antigo.
        with: { path: fiapx-video-processor, fetch-depth: 0 }
      - name: Baixar o fiapx-docs (contratos)
        uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-docs, path: fiapx-docs }
      - name: Baixar o fiapx-infra (ambiente local)
        uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-infra, path: fiapx-infra }
      - name: Subir o ambiente local (MySQL, LocalStack e Mailpit)
        working-directory: fiapx-infra/local
        run: docker compose up -d --wait
      - name: Preparar o worker (imagem de desenvolvimento com ffmpeg e dependências)
        run: |
          cp .env.example .env
          docker compose build -q processor
          docker compose run --rm -q processor composer install --no-interaction --no-progress
      - name: Rodar o Pint e o PHPStan
        run: docker compose run --rm -q processor composer lint
      - name: Rodar o PHPUnit com cobertura ≥ 80% (unit, contrato e integração)
        run: docker compose run --rm -q processor composer test:coverage
      - name: Ajustar os caminhos da cobertura (do container para o runner)
        # O PHPUnit roda no container, com o código em /var/www/html; o scanner roda no runner.
        run: sudo sed -i "s#/var/www/html#$GITHUB_WORKSPACE/fiapx-video-processor#g" coverage/clover.xml
      - name: Analisar no SonarCloud e esperar o Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        with:
          projectBaseDir: fiapx-video-processor
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Mostrar os logs do ambiente local (só em falha)
        if: failure()
        working-directory: fiapx-infra/local
        run: docker compose logs --no-color

  imagem:
    name: Imagem de produção e Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Construir a imagem de produção (linux/amd64)
        run: docker build --platform linux/amd64 -t fiapx-video-processor:${{ github.sha }} .
      - name: Procurar vulnerabilidades CRITICAL na imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fiapx-video-processor:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  manifests:
    name: Manifests do Kubernetes (kustomize e kubeconform)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Gerar e validar os manifests do overlay prod (kustomize e kubeconform)
        run: |
          cp k8s/overlays/prod/aws.env.example k8s/overlays/prod/aws.env
          docker run --rm -v "$PWD/k8s":/k8s registry.k8s.io/kustomize/kustomize:v5.6.0 build /k8s/overlays/prod > manifests.yaml
          docker run --rm -v "$PWD":/w ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 /w/manifests.yaml
