# Na AWS Academy não há Pod Identity (ADR-019): os pods usam as credenciais da LabRole dos nós, pelo IMDS
# (o SDK da AWS as encontra sozinho). Em conta própria, a role do worker (S3 get/put/delete em uploads/* e
# results/*, SQS na processing-commands e na saga-replies.fifo, SSM em /fiapx/<env>/*) seria associada aqui.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fiapx-video-processor
